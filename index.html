<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접근성 마크업 점검기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">BROWSER-ONLY AUDIT</p><h1>접근성 마크업 점검기</h1><p>붙여 넣은 HTML의 기본 접근성 마크업을 빠르게 확인합니다. iframe 제목, 데이터 표 이름, 버튼 이름, 초점 가능 요소의 aria-hidden 사용도 안내합니다.</p></header>
    <div class="workspace">
      <section class="panel"><form id="audit-form"><label for="html-input">점검할 HTML</label><textarea id="html-input" spellcheck="false"><html lang="ko"><head><title>나의 포트폴리오</title></head><body><h1>홍길동 포트폴리오</h1><h2>최근 작업</h2><img src="profile.jpg" alt="홍길동 프로필 사진"><a href="/work">프로젝트 상세 보기</a></body></html></textarea><button type="submit">접근성 점검하기</button></form></section>
      <section class="panel results" aria-live="polite" aria-label="점검 결과"><div id="report"></div></section>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
